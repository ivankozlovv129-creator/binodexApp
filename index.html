<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BinoDex AI — Trading Terminal</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // Кастомная палитра BinoDex (мятно-зеленый акцент и темный фон)
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            binodex: {
              bg: '#11141d',
              card: '#181c26',
              border: '#252a37',
              accent: '#10b981',
              accentHover: '#059669',
              lightAccent: '#34d399',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #11141d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .card {
      background: #181c26;
      border: 1px solid #252a37;
    }
    #tradingview_widget_container {
      height: 380px;
      width: 100%;
    }
  </style>
</head>
<body class="p-3 flex flex-col justify-between min-h-screen">

  <div>
    <!-- Шапка Mini App с логотипом BinoDex -->
    <div class="flex justify-between items-center mb-3">
      <div class="flex items-center gap-2">
        <div class="w-3 h-6 bg-emerald-400 rounded-full transform -rotate-45 shadow-[0_0_10px_#10b981]"></div>
        <h1 class="text-xl font-black tracking-wide text-white">Bino<span class="text-emerald-400">Dex</span></h1>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20 font-semibold">
        ● AI SIGNAL
      </span>
    </div>

    <!-- Выбор валютных пар OTC -->
    <div class="mb-3">
      <label class="block text-xs text-gray-400 mb-1 font-semibold uppercase tracking-wider">Валютная пара (OTC)</label>
      <select id="asset-select" onchange="changeAsset()" class="w-full card p-3 rounded-xl text-sm font-medium text-white focus:outline-none focus:border-emerald-500 transition-all">
        <option value="FX:EURUSD">EUR/USD OTC</option>
        <option value="FX:GBPUSD">GBP/USD OTC</option>
        <option value="FX:USDCHF">USD/CHF OTC</option>
        <option value="FX:USDJPY">USD/JPY OTC</option>
        <option value="FX:USDCAD">USD/CAD OTC</option>
        <option value="FX:AUDUSD">AUD/USD OTC</option>
        <option value="FX:NZDUSD">NZD/USD OTC</option>
      </select>
    </div>

    <!-- График TradingView -->
    <div class="card rounded-2xl overflow-hidden mb-3 shadow-xl">
      <div id="tradingview_widget_container"></div>
    </div>

    <!-- Время сделки (Экспирация) -->
    <div class="mb-4">
      <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Время сделки</label>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="setTime('1M', this)" class="tf-btn card p-2.5 rounded-xl text-center text-xs font-bold border-emerald-500 bg-emerald-500/15 text-emerald-400">1M</button>
        <button onclick="setTime('2M', this)" class="tf-btn card p-2.5 rounded-xl text-center text-xs font-bold text-gray-300">2M</button>
        <button onclick="setTime('3M', this)" class="tf-btn card p-2.5 rounded-xl text-center text-xs font-bold text-gray-300">3M</button>
        <button onclick="setTime('5M', this)" class="tf-btn card p-2.5 rounded-xl text-center text-xs font-bold text-gray-300">5M</button>
      </div>
    </div>

    <!-- Кнопка генерации AI сигнала в цвете BinoDex -->
    <button onclick="getSignal()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-sm rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all active:scale-95 uppercase tracking-wider">
      ⚡ Получить AI Сигнал
    </button>

    <!-- Вывод результатов сигнала -->
    <div id="signal-result" class="hidden card mt-4 p-4 rounded-2xl text-center shadow-lg border-emerald-500/30">
      <div class="text-xs text-gray-400 mb-1 font-semibold uppercase" id="signal-info">EUR/USD OTC • 1M</div>
      
      <div id="signal-direction" class="text-2xl font-black my-1 text-emerald-400">
        ▲ CALL (ВВЕРХ)
      </div>

      <div class="w-full bg-slate-800 rounded-full h-2 my-3 overflow-hidden">
        <div id="signal-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-500 shadow-[0_0_10px_#34d399]" style="width: 88%"></div>
      </div>
      
      <div class="flex justify-between text-xs text-gray-400 mt-2 font-medium">
        <span>Прогноз AI: <b id="signal-accuracy" class="text-white">88%</b></span>
        <span>Индикатор: <b class="text-white">RSI + Volume</b></span>
      </div>
    </div>
  </div>

  <!-- Подключение виджета TradingView -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  
  <script type="text/javascript">
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentSymbol = "FX:EURUSD";
    let selectedTimeframe = "1M";

    function loadTradingViewChart(symbol) {
      document.getElementById('tradingview_widget_container').innerHTML = '';

      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "1",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "ru",
        "toolbar_bg": "#181c26",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "hide_side_toolbar": true,
        "allow_symbol_change": false,
        "container_id": "tradingview_widget_container"
      });
    }

    window.onload = function() {
      loadTradingViewChart(currentSymbol);
    };

    function changeAsset() {
      const select = document.getElementById('asset-select');
      currentSymbol = select.value;
      loadTradingViewChart(currentSymbol);
    }

    function setTime(tf, element) {
      selectedTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-500/15', 'border-emerald-500', 'text-emerald-400');
        btn.classList.add('text-gray-300');
      });
      element.classList.add('bg-emerald-500/15', 'border-emerald-500', 'text-emerald-400');
      element.classList.remove('text-gray-300');
    }

    function getSignal() {
      const select = document.getElementById('asset-select');
      const assetName = select.options[select.selectedIndex].text;
      
      const isCall = Math.random() > 0.5;
      const accuracy = Math.floor(Math.random() * 11) + 85;

      const dirEl = document.getElementById('signal-direction');
      const barEl = document.getElementById('signal-bar');

      document.getElementById('signal-info').innerText = `${assetName} • ${selectedTimeframe}`;
      
      if (isCall) {
        dirEl.innerText = "▲ CALL (ВВЕРХ)";
        dirEl.className = "text-2xl font-black my-1 text-emerald-400";
        barEl.className = "bg-emerald-400 h-2 rounded-full transition-all duration-500 shadow-[0_0_10px_#34d399]";
      } else {
        dirEl.innerText = "▼ PUT (ВНИЗ)";
        dirEl.className = "text-2xl font-black my-1 text-rose-500";
        barEl.className = "bg-rose-500 h-2 rounded-full transition-all duration-500 shadow-[0_0_10px_#f43f5e]";
      }

      barEl.style.width = `${accuracy}%`;
      document.getElementById('signal-accuracy').innerText = `${accuracy}%`;
      document.getElementById('signal-result').classList.remove('hidden');

      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }
  </script>
</body>
</html>
